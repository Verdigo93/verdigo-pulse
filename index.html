<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Verdigo Pulse v2.1</title><style>
:root{color-scheme:dark;--bg:#0e0e0f;--panel:#1a1a1c;--line:#333335;--yellow:#ffd500;--muted:#adadb2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f8f8;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:25px 25px 75px}.top,.between,.actions,.filters,.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.5px;font-size:19px}.logo{background:var(--yellow);color:#111;padding:10px;border-radius:11px;font-weight:900;font-size:24px}.sub,.muted{color:var(--muted)}small{font-size:12px}h1{font-size:clamp(25px,4vw,40px);margin:35px 0 8px}h2{font-size:20px;margin:0 0 14px}.switch{display:flex;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}button{border:1px solid var(--line);background:#252527;color:#eee;border-radius:10px;padding:10px 15px}button.sel,.yellow{background:var(--yellow);color:#121212;font-weight:800;border-color:var(--yellow)}.categories{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}.categories button{border-radius:24px;white-space:nowrap}.filters{background:var(--panel);padding:12px;border-radius:15px;border:1px solid var(--line);flex-wrap:wrap}.filters input{flex:1;min-width:170px}input,select{background:#29292b;color:#fff;border:1px solid #454548;border-radius:10px;padding:12px}section{margin-top:29px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:12px}.stat b{display:block;font-size:28px;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(295px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}.card h3{font-size:17px;line-height:1.4;margin:10px 0}.meta{font-size:12px;color:#bababe}.tag{font-size:11px;letter-spacing:.5px;font-weight:800;color:var(--yellow)}.pill{font-size:11px;border-radius:9px;background:#2b2819;color:#ffe17a;padding:5px 8px}.card a{color:var(--yellow);text-decoration:none;font-weight:600}.card .actions{margin-top:13px;flex-wrap:wrap}.card .actions button{padding:9px 11px;font-size:12px}.banner{padding:14px 17px;border-left:3px solid var(--yellow);background:#242118;border-radius:6px;color:#e9dfbd;margin-top:16px}.note{line-height:1.5;color:#bdbdc1;margin:7px 0 17px}.empty{padding:25px;border:1px dashed #4a4a4e;border-radius:12px;color:#aaa}.idea{margin-top:12px;border:1px solid #45412c;background:#27251c;padding:12px;border-radius:10px}.idea strong{color:#fff}.idea p{line-height:1.5}.idea button{margin:4px 5px 3px 0}.status{font-size:12px;white-space:normal;line-height:1.6}.health{margin-top:25px}.health summary{cursor:pointer}.health span{display:inline-block;margin:4px;border:1px solid #39393e;border-radius:8px;padding:6px 9px}.good{color:#61e9a4}.bad{color:#f1a58b}.smallcaps{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:1px}.foot{margin:40px 0;color:#888;font-size:12px}.sectionhead{display:flex;justify-content:space-between;gap:15px;align-items:baseline;flex-wrap:wrap;margin:0 0 12px}a{overflow-wrap:anywhere}@media(max-width:620px){.wrap{padding:14px}.stats{grid-template-columns:1fr}.filters{align-items:stretch}.filters input{width:100%}h1{margin-top:23px}.categories{gap:5px}.categories button{padding:9px 10px}}
@media(max-width:760px){.wrap{padding:12px}.categories{flex-wrap:nowrap;overflow-x:auto;padding-bottom:9px;scrollbar-width:thin}.categories button{flex:none}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}.filters #periods{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}.filters #search{grid-column:1/-1;min-width:0}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{padding:10px}.stat b{font-size:23px}.stat small{font-size:10px}.grid{grid-template-columns:minmax(0,1fr)}.card .actions button{min-height:42px}}.preferences{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:12px;margin-top:13px}.preferences summary{cursor:pointer;font-weight:700}.preferences label{display:inline-flex;gap:7px;align-items:center;padding:7px}.pref-note{font-size:12px;color:var(--muted);line-height:1.5}button:focus-visible,input:focus-visible{outline:2px solid var(--yellow)}</style></head><body><main class="wrap"><header class="between"><div class="top"><span class="logo">V</span><div><div class="brand">VERDIGO PULSE <span class="pill">v2.1</span></div><small class="muted">DISCOVER WHAT'S NEXT</small></div></div><div class="switch"><button id="en" class="sel" onclick="setLang('en')">EN</button><button id="ru" onclick="setLang('ru')">RU</button></div></header><h1 id="headline"></h1><div class="between"><p id="subtitle" class="sub"></p><small class="muted" id="updated"></small></div><nav class="categories" id="categories"></nav><div class="filters"><div class="switch" id="periods"><button data-days="1">24H</button><button class="sel" data-days="7">7D</button><button data-days="30">30D</button></div><input id="search" placeholder="Search..." oninput="render()"><button id="refresh" class="yellow" onclick="load(true)">↻ Refresh</button></div><div class="preferences"><label><input type="checkbox" id="savedOnly" onchange="render()"> <span id="savedOnlyText"></span></label><details><summary id="alertHead"></summary><div id="alertOptions"></div><p id="alertExplainer" class="pref-note"></p><button id="alertEnable" onclick="enableAlerts()"></button><p id="alertFeedback" class="pref-note" aria-live="polite"></p></details></div><div class="stats"><div class="stat"><b id="datedCount">—</b><small id="datedLabel"></small></div><div class="stat"><b id="leadsCount">—</b><small id="leadsLabel"></small></div><div class="stat"><b id="connectedCount">—</b><small id="connectedLabel"></small></div></div><div id="warning" class="banner" hidden></div><section><div class="sectionhead"><h2 id="datedTitle"></h2><small class="muted" id="datedSubtitle"></small></div><div class="grid" id="dated"></div></section><section><div class="sectionhead"><h2 id="candidatesTitle"></h2><small id="candidateTotal" class="muted"></small></div><p class="note" id="candidatesHint"></p><div class="grid" id="candidates"></div></section><section><div class="sectionhead"><h2 id="researchTitle"></h2><small id="researchTotal" class="muted"></small></div><p id="researchHint" class="note"></p><div class="grid" id="research"></div><button id="more" style="margin-top:14px" onclick="showMore()"></button></section><details class="health"><summary id="healthTitle"></summary><div id="healthStatuses" class="status"></div></details><p class="foot" id="foot"></p></main><script>
const LANG={en:{headline:'The next big events. Before they happen.',subtitle:'Upcoming events, dated announcements and news leads — clearly separated.',datedLabel:'Scheduled events in this category',leadsLabel:'News & announcement leads',connectedLabel:'Available calendar / feed sources',datedTitle:'Scheduled upcoming events',datedSubtitle:'Only scheduled dates from calendar providers',candidatesTitle:'Upcoming announcements with dates',candidatesHint:'Headlines mentioning a future date. Unverified: inspect the original publication before drafting a market.',researchTitle:'Latest signals & market ideas',researchHint:'Fresh reporting, official announcements and research leads. Not necessarily scheduled future events.',warning:'Some sources are not responding. Missing coverage does not mean there are no world events.',emptyDated:'No confirmed calendar records for this category and period from connected services. Explore announcements and research below.',emptyCandidates:'No future date detected in current feed headlines. Check the fresh reports below.',emptyResearch:'No reporting available from connected feeds right now. Review source status below.',healthTitle:'Connection diagnostics · view all sources',more:'Show more news',refresh:'↻ Refresh',market:'Draft market idea',copy:'Copy text',source:'Original source ↗',close:'Hide idea',saved:'★ Saved',save:'☆ Save',verified:'Scheduled (third-party)',unverified:'Date mentioned · not verified',updated:'Updated',foot:'Independent discovery tool. Not affiliated with Kash. News is not proof of a future event. Verify the schedule, cutoff and settlement source before publishing.',categories:['All','Crypto','Football','Sports','Politics','Finance','AI','Gaming'],ideaNote:'Suggested wording for review — not an automatic verified market.',noDate:'Date not verified',savedOnly:'Saved only',alertHead:'Customize discovery alerts',alertExplainer:'New items are checked only while this tab is open. No messages arrive after closing it.',alertEnable:'Enable browser notifications'},ru:{headline:'Главные события — ещё до того, как они произойдут.',subtitle:'Ближайшие события, анонсы с датами и новости — отдельно и понятно.',datedLabel:'События с расписанием в категории',leadsLabel:'Новостей и анонсов',connectedLabel:'Доступных календарей и источников',datedTitle:'Подтверждённое расписание',datedSubtitle:'Даты из календарных источников',candidatesTitle:'Анонсы с будущими датами',candidatesHint:'Заголовки с будущей датой. Не подтверждено: проверьте оригинал до создания маркета.',researchTitle:'Новости и идеи для маркетов',researchHint:'Свежие публикации и анонсы, которые могут подсказать событие. Не обязательно будущие события.',warning:'Часть источников не отвечает. Это не означает, что в мире нет событий.',emptyDated:'В подключённых календарях нет записей для этой категории и периода. Ниже — анонсы и свежие материалы.',emptyCandidates:'В заголовках доступных публикаций нет конкретной будущей даты. Смотрите новости ниже.',emptyResearch:'От подключённых лент пока нет публикаций. Проверьте состояние источников ниже.',healthTitle:'Диагностика · все источники',more:'Больше новостей',refresh:'↻ Обновить',market:'Подготовить маркет',copy:'Скопировать',source:'Первоисточник ↗',close:'Скрыть идею',saved:'★ Сохранено',save:'☆ Сохранить',verified:'По расписанию',unverified:'Дата в заголовке · не проверено',updated:'Обновлено',foot:'Независимый исследовательский инструмент, не связан с Kash. Новость не доказывает будущего события. Проверяйте время, дедлайн и источник результата.',categories:['Все','Крипто','Футбол','Спорт','Политика','Финансы','ИИ','Игры'],ideaNote:'Черновик формулировки — не автоматически проверенный маркет.',noDate:'Дата не проверена',savedOnly:'Только сохранённое',alertHead:'Настроить уведомления',alertExplainer:'Новые материалы проверяются только при открытой вкладке. После закрытия уведомления не приходят.',alertEnable:'Включить уведомления браузера'}};
const KEYS=['all','crypto','football','sports','politics','finance','ai','gaming'];const ICONS=['🌐','🪙','⚽','🏆','🏛️','💳','🤖','🎮'];let lang=localStorage.getItem('vp2lang')==='ru'?'ru':'en',cat='all',days=7,events=[],leads=[],calStatus=[],feedStatus=[],visible=18,expanded=new Set(),saved=new Set(JSON.parse(localStorage.getItem('vp2saved')||'[]'));const $=id=>document.getElementById(id);const T=k=>LANG[lang][k]||k;const safe=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let alertCats=new Set(JSON.parse(localStorage.getItem('pulseAlerts')||'["crypto","football","sports","politics","finance","ai","gaming"]'));let seenIds=new Set(),initialLoad=true;function setAlertCat(k,v){v?alertCats.add(k):alertCats.delete(k);localStorage.setItem('pulseAlerts',JSON.stringify([...alertCats]));}async function enableAlerts(){if(!('Notification' in window)||!window.isSecureContext){$('alertFeedback').textContent='Browser notifications unavailable';return}let status=await Notification.requestPermission();$('alertFeedback').textContent=status==='granted'?'Notifications enabled for this tab':'Notifications not enabled';}const locale=()=>lang==='ru'?'ru-RU':'en-GB';const date=x=>{try{return new Date(x).toLocaleString(locale(),{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return x}};
function setLang(x){lang=x;localStorage.setItem('vp2lang',x);document.documentElement.lang=x;render()}function setCat(x){cat=x;visible=18;expanded.clear();render()}function showMore(){visible+=18;render()}function ruleFor(e){
if(e.home&&e.away)return 'Will '+e.home+' defeat '+e.away+' in regulation time?\nYES: '+e.home+' wins after 90 minutes plus stoppage time. NO: draw or '+e.away+' wins.\nResolution: official league match report. Close market before kickoff.';
if(e.category==='gaming')return 'RESEARCH DRAFT: '+e.title+'\nBefore publishing, identify the exact title, publisher, platform, region, UTC deadline and official launch announcement. This article alone is not settlement evidence.';
if(e.category==='finance')return 'RESEARCH DRAFT: '+e.title+'\nSelect one measurable economic result, define units and an exact UTC release deadline, and use the official issuing institution as the resolution source.';
return 'RESEARCH DRAFT: '+e.title+'\nDefine one objective binary future outcome, an exact UTC deadline and an authoritative public source. Do not publish until all three are verified.';
}
function ideaView(e){let id=e.id;if(!expanded.has(id))return '';let txt=ruleFor(e);return `<div class="idea"><small>${T('ideaNote')}</small><p><strong>${safe(txt).replace(/\n/g,'<br>')}</strong></p><button class="yellow" data-copy="${safe(id)}">${T('copy')}</button> <a href="https://app.kash.bot/launch" target="_blank" rel="noopener">Kash ↗</a></div>`}
function card(e,isEvent){let id=e.id;let when=isEvent?date(e.start):date(e.published);let future=e.mentionedFutureDate;return `<article class="card"><div class="between"><span class="tag">${safe((LANG[lang].categories[KEYS.indexOf(e.category)]||e.category).toUpperCase())}</span><span class="pill">${isEvent?T('verified'):(future?T('unverified'):safe(e.source))}</span></div><h3>${safe(e.title)}</h3><p class="meta">${safe(e.source)} · ${safe(when)}</p>${future&&!isEvent?`<p class="meta">📅 ${date(future)} · ${T('noDate')}</p>`:''}${isEvent&&e.context?`<p class="meta">${safe(e.context)} · ${safe(e.sourceNote||'')}</p>`:''}<div class="actions"><a href="${safe(e.url)}" target="_blank" rel="noopener noreferrer">${T('source')}</a><button data-idea="${safe(id)}">${expanded.has(id)?T('close'):T('market')}</button><button data-save="${safe(id)}">${saved.has(id)?T('saved'):T('save')}</button></div>${ideaView(e)}</article>`}
function render(){let words=LANG[lang];$('savedOnlyText').textContent=T('savedOnly');$('alertHead').textContent=T('alertHead');$('alertExplainer').textContent=T('alertExplainer');$('alertEnable').textContent=T('alertEnable');$('alertOptions').innerHTML=KEYS.slice(1).map((k,i)=>'<label><input type="checkbox" data-alert="'+k+'" '+(alertCats.has(k)?'checked':'')+'>'+ICONS[i+1]+' '+words.categories[i+1]+'</label>').join('');$('en').classList.toggle('sel',lang==='en');$('ru').classList.toggle('sel',lang==='ru');for(let k of ['headline','subtitle','datedLabel','leadsLabel','connectedLabel','datedTitle','datedSubtitle','candidatesTitle','candidatesHint','researchTitle','researchHint','healthTitle','more','refresh','foot'])$(k).textContent=T(k);$('categories').innerHTML=KEYS.map((k,i)=>`<button class="${cat===k?'sel':''}" data-cat="${k}">${ICONS[i]} ${words.categories[i]}</button>`).join('');for(let b of document.querySelectorAll('[data-days]'))b.classList.toggle('sel',Number(b.dataset.days)===days);let q=$('search').value.toLowerCase().trim();let match=e=>(cat==='all'||e.category===cat)&&(!$('savedOnly').checked||saved.has(e.id))&&(!q||[e.title,e.source,e.context].join(' ').toLowerCase().includes(q));let dated=events.filter(match),rows=leads.filter(match),future=rows.filter(x=>x.mentionedFutureDate&&new Date(x.mentionedFutureDate)>=new Date()&&new Date(x.mentionedFutureDate)<=new Date(Date.now()+days*86400000));let nSources=calStatus.filter(x=>x.status==='ok').length+feedStatus.filter(x=>x.status==='ok').length;let failures=calStatus.filter(x=>x.status==='error').length+feedStatus.filter(x=>x.status==='error').length;$('datedCount').textContent=dated.length;$('leadsCount').textContent=rows.length;$('connectedCount').textContent=nSources;$('warning').hidden=failures===0;$('warning').textContent=T('warning')+` (${failures})`;$('dated').innerHTML=dated.length?dated.sort((a,b)=>a.start.localeCompare(b.start)).map(x=>card(x,true)).join(''):`<div class="empty">${T('emptyDated')}</div>`;$('candidateTotal').textContent=future.length+' / '+days+'D';$('candidates').innerHTML=future.length?future.sort((a,b)=>a.mentionedFutureDate.localeCompare(b.mentionedFutureDate)).map(x=>card(x,false)).join(''):`<div class="empty">${T('emptyCandidates')}</div>`;$('researchTotal').textContent=rows.length+' articles';$('research').innerHTML=rows.length?rows.slice(0,visible).map(x=>card(x,false)).join(''):`<div class="empty">${T('emptyResearch')}</div>`;$('more').hidden=rows.length<=visible;$('healthStatuses').innerHTML=[...calStatus.map(x=>({...x,type:'CAL'})),...feedStatus.map(x=>({...x,type:'RSS'}))].map(x=>`<span class="${x.status==='ok'?'good':'bad'}">${x.status==='ok'?'●':'×'} ${x.type} ${safe(x.name)} (${x.count||0})${x.reason?' · '+safe(x.reason):''}</span>`).join('');}
async function load(force=false){$('refresh').disabled=true;$('updated').textContent=lang==='ru'?'Загружаем источники…':'Loading sources…';try{const [a,b]=await Promise.all([fetch('/api/events?days='+days+(force?'&refresh=1':'')+'&_='+Date.now(),{cache:'no-store'}),fetch('/api/leads?'+(force?'refresh=1&':'')+'_='+Date.now(),{cache:'no-store'})]);if(!a.ok||!b.ok)throw Error('HTTP '+a.status+'/'+b.status);const ev=await a.json(),ld=await b.json();events=ev.events||[];leads=ld.leads||[];let all=[...events,...leads];if(!initialLoad){let newItems=all.filter(x=>!seenIds.has(x.id)&&alertCats.has(x.category));if(newItems.length){$('alertFeedback').textContent=(lang==='ru'?'Новых материалов: ':'New items: ')+newItems.length;if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification('Verdigo Pulse',{body:newItems[0].title});}}seenIds=new Set(all.map(x=>x.id));initialLoad=false;calStatus=ev.sourceStatuses||[];feedStatus=ld.sourceStatuses||[];$('updated').textContent=T('updated')+': '+date(ev.generated);render()}catch(e){$('updated').textContent='Source error: '+e.message;console.error(e)}finally{$('refresh').disabled=false}}
$('alertOptions').addEventListener('change',e=>{let k=e.target.dataset.alert;if(k)setAlertCat(k,e.target.checked)});setInterval(()=>{load()},900000);$('categories').addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(b)setCat(b.dataset.cat)});$('periods').addEventListener('click',e=>{let b=e.target.closest('[data-days]');if(b){days=Number(b.dataset.days);load()}});document.addEventListener('click',e=>{let b=e.target.closest('[data-idea], [data-save], [data-copy]');if(!b)return;if(b.dataset.idea){expanded.has(b.dataset.idea)?expanded.delete(b.dataset.idea):expanded.add(b.dataset.idea);render()}if(b.dataset.save){saved.has(b.dataset.save)?saved.delete(b.dataset.save):saved.add(b.dataset.save);localStorage.setItem('vp2saved',JSON.stringify([...saved]));render()}if(b.dataset.copy){let obj=[...events,...leads].find(x=>x.id===b.dataset.copy);if(obj)navigator.clipboard.writeText(ruleFor(obj)).catch(()=>{})}});render();load();
</script></body></html>
